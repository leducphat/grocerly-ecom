{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>404 - Không tìm thấy trang | Grocerly</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/imgs/theme/favicon.svg' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/main.css' %}" />
    <style>
        body {
            background: #f7f8fa;
            font-family: 'Lato', sans-serif;
        }
        .error-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-size: 140px;
            font-weight: 900;
            color: #3BB77E;
            line-height: 1;
            margin-bottom: 10px;
        }
        .error-title {
            font-size: 28px;
            color: #253D4E;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .error-desc {
            font-size: 16px;
            color: #838383;
            margin-bottom: 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .btn-back {
            display: inline-block;
            background-color: #3BB77E;
            color: white;
            padding: 14px 35px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-back:hover {
            background-color: #29a56c;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 183, 126, 0.3);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div>
            <a href="/">
                <img src="{% static 'assets/imgs/theme/logo.svg' %}" alt="Grocerly" style="max-width: 180px; margin-bottom: 40px;" />
            </a>
            <div class="error-code">404</div>
            <h1 class="error-title">Oops! Trang này không tồn tại</h1>
            <p class="error-desc">
                Đường link bạn truy cập có thể đã bị xóa, đổi tên, hoặc tạm thời không khả dụng.
            </p>
            <a href="/" class="btn-back">← Quay về Trang Chủ</a>
        </div>
    </div>
</body>
</html>
