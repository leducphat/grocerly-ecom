{% for p in products %}
<div class="col-lg-1-5 col-md-4 col-12 col-sm-6">
    <div class="product-cart-wrap mb-30">
        <div class="product-img-action-wrap">
            <div class="product-img product-img-zoom">
                <a href="{% url 'core:product-detail' p.p_id %}">
                    <img class="default-img" src="{{ p.image.url }}" alt="" />
                    <img class="hover-img" src="{{ p.image.url }}" alt="" />
                </a>
            </div>
            <div class="product-action-1">
                <a aria-label="Quick view" href="{% url 'core:product-detail' p.p_id %}" class="action-btn"><i class="fi-rs-eye"></i></a>
            </div>
            {% if p.get_percentage > 0 %}
            <div class="product-badges product-badges-position product-badges-mrg">
                <span class="hot">-{{ p.get_percentage }}%</span>
            </div>
            {% endif %}
        </div>
        <div class="product-content-wrap">
            <div class="product-category">
                <a href="{% url 'core:category-product-list' p.category.c_id %}">{{ p.category.title }}</a>
            </div>
            <h2><a href="{% url 'core:product-detail' p.p_id %}">{{ p.title }}</a></h2>
            <div class="product-rate-cover">
                <i class="fas fa-star text-warning"></i>
                <span class="font-small ml-5 text-muted"> ({{ p.reviews.all.count }})</span>
            </div>
            <div>
                <span class="font-small text-muted">By <a href="{% url 'core:vendor-detail' p.vendor.v_id %}">{{ p.vendor.name }}</a></span>
            </div>
            <div class="product-card-bottom">
                <div class="product-price">
                    <span>$</span><span class="current-product-price-{{ p.id }}">{{ p.price }}</span>
                    <span class="old-price">${{ p.old_price }}</span>
                </div>
                <div class="add-cart">
                    <input type="hidden" value="1" class="product-quantity-{{ p.id }}">
                    <input type="hidden" class="product-pid-{{ p.id }}" value="{{ p.p_id }}">
                    <input type="hidden" class="product-image-{{ p.id }}" value="{{ p.image.url }}">
                    <input type="hidden" class="product-id-{{ p.id }}" value="{{ p.id }}">
                    <input type="hidden" class="product-title-{{ p.id }}" value="{{ p.title }}">
                    <button class="add add-to-cart-btn" data-index="{{ p.id }}" style="border: none;"><i class="fi-rs-shopping-cart mr-5"></i>Add</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% empty %}
<div class="col-12">
    <p>No products found for selected vendors.</p>
</div>
{% endfor %}
